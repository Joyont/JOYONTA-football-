<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOYONTA Football</title>
<style>
  body {
    margin: 0; background: #222; color: #fff; font-family: Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; user-select: none;
  }
  canvas {
    background: #2e8b3a; border: 4px solid #fff; border-radius: 10px;
    max-width: 96vw; height: auto; touch-action: none;
  }
  #info { margin-top: 10px; font-size: 14px; text-align: center; }
</style>
</head>
<body>
<canvas id="game" width="800" height="500"></canvas>
<div id="info">
  <b>JOYONTA Football</b> &nbsp;•&nbsp;
  Move: Arrow/WASD or drag &nbsp;•&nbsp; Shoot: SPACE or tap &nbsp;•&nbsp;
  C = Collection &nbsp;•&nbsp; T = Theme &nbsp;•&nbsp; P = Pack Shop &nbsp;•&nbsp; M = Match time &nbsp;•&nbsp; ESC = Menu
</div>

<script>
// ================= SETTINGS (tune here) =================
const GAME_NAME = 'JOYONTA FOOTBALL';
const LEVELS = {
  1: { name: "Easy",   aiSpeed: 2.2, reaction: 40, aimError: 0.45, mistake: 0.25, kickPower: 8 },
  2: { name: "Normal", aiSpeed: 2.8, reaction: 22, aimError: 0.25, mistake: 0.12, kickPower: 9 },
  3: { name: "Hard",   aiSpeed: 3.3, reaction: 10, aimError: 0.10, mistake: 0.04, kickPower: 10 }
};
const MATCH_OPTIONS = [5, 8, 10];   // match length in minutes (choose in menu)
const START_COINS = 300;            // coins for new players
const PACK_COST = 150;              // cost of one pack
const DUP_REFUND = 40;              // coins back if you pull a player you already have
const GOAL_REWARD = 25;             // coins per goal you score
const RESULT_REWARD = { win: 100, draw: 50, lose: 20 };
// ========================================================

// Themes: only colors change, so the game stays simple
const THEMES = {
  classic: { name: 'Classic',  grass: '#2e8b3a', stripe: 'rgba(255,255,255,0.04)', line: '#ffffff',
             ai: '#d62828', body: '#222222', border: '#ffffff', ballFill: '#ffffff', ballLine: '#000000' },
  night:   { name: 'Night',    grass: '#14432f', stripe: 'rgba(255,255,255,0.03)', line: '#bfdbfe',
             ai: '#7c3aed', body: '#050816', border: '#bfdbfe', ballFill: '#ffffff', ballLine: '#000000' },
  desert:  { name: 'Desert',   grass: '#c9a227', stripe: 'rgba(0,0,0,0.05)',       line: '#fff7ed',
             ai: '#7c2d12', body: '#3b2a10', border: '#fff7ed', ballFill: '#ffffff', ballLine: '#000000' },
  snow:    { name: 'Snow',     grass: '#e5f3ff', stripe: 'rgba(0,0,0,0.03)',       line: '#1e3a8a',
             ai: '#0f766e', body: '#1e293b', border: '#ffffff', ballFill: '#facc15', ballLine: '#000000' },
  brazil:  { name: 'Brazil',   grass: '#0a8f3c', stripe: 'rgba(0,0,0,0)',          line: '#ffdf00',
             ai: '#002776', body: '#002776', border: '#ffdf00', ballFill: '#ffffff', ballLine: '#000000' },
  neon:    { name: 'Neon',     grass: '#0b1020', stripe: 'rgba(34,211,238,0.05)',  line: '#22d3ee',
             ai: '#f0abfc', body: '#000000', border: '#22d3ee', ballFill: '#ffffff', ballLine: '#000000' }
};

const RARITY = {
  common: { name: 'Common', color: '#9ca3af', weight: 57 },
  rare:   { name: 'Rare',   color: '#3b82f6', weight: 28 },
  epic:   { name: 'Epic',   color: '#a855f7', weight: 10 },
  legend: { name: 'Legend', color: '#f59e0b', weight: 5  }
};

// Stats are 1-10. Higher = better.
const PLAYERS = [
  { name: 'Rafi',    rarity: 'common', speed: 5, power: 4,  control: 5, color: '#1d4ed8' },
  { name: 'Sami',    rarity: 'common', speed: 4, power: 5,  control: 5, color: '#0ea5e9' },
  { name: 'Tuhin',   rarity: 'common', speed: 5, power: 5,  control: 4, color: '#14b8a6' },
  { name: 'Nafis',   rarity: 'common', speed: 6, power: 4,  control: 4, color: '#22c55e' },
  { name: 'Arif',    rarity: 'rare',   speed: 6, power: 6,  control: 5, color: '#a855f7' },
  { name: 'Shakil',  rarity: 'rare',   speed: 7, power: 5,  control: 6, color: '#f97316' },
  { name: 'Rony',    rarity: 'rare',   speed: 6, power: 7,  control: 5, color: '#ec4899' },
  { name: 'Zidan',   rarity: 'epic',   speed: 8, power: 7,  control: 6, color: '#eab308' },
  { name: 'Jisan',   rarity: 'epic',   speed: 7, power: 8,  control: 7, color: '#84cc16' },
  { name: 'Tiger',   rarity: 'epic',   speed: 8, power: 6,  control: 8, color: '#f43f5e' },
  { name: 'Phoenix', rarity: 'legend', speed: 9, power: 9,  control: 8, color: '#dc2626' },
  { name: 'Titan',   rarity: 'legend', speed: 8, power: 10, control: 9, color: '#334155' }
];

// ---------- Save / Load ----------
const SAVE_KEY = 'kickchamp-v2';
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && Array.isArray(s.owned) && s.owned.length) {
      if (!s.owned.includes(s.selected)) s.selected = s.owned[0];
      if (!THEMES[s.theme]) s.theme = 'classic';   // old saves get default theme
      return s;
    }
  } catch (e) {}
  return { coins: START_COINS, owned: [0], selected: 0, theme: 'classic' };
}
function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}
let save = loadSave();

// ---------- Canvas & state ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 500;
const GL = 12, GOAL_TOP = 170, GOAL_BOTTOM = 330;
const MAX_BALL = 13, FRICTION = 0.985;

let screen = 'menu';            // menu | play | over | collection | shop | theme
let level = 2;
let matchMinutes = 5;          // selected match length
let timeLeft = 0;
let score = { you: 0, ai: 0 };
let msg = '', msgTimer = 0;
let shotQueued = false, touchTarget = null;
let aiTimer = 0, aiKickCooldown = 0;
let aiTarget = { x: 600, y: H / 2 };
let buttons = [];               // clickable areas, rebuilt every frame
let lastPull = null;
let lastReward = 0, lastResult = 'draw';
const keys = {};

const player = { x: 200, y: H / 2, vx: 0, vy: 0, r: 18, speed: 2.8, power: 7, err: 0.1 };
const ai     = { x: 600, y: H / 2, vx: 0, vy: 0, r: 18 };
const ball   = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 10 };

// ---------- Helpers ----------
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function toast(t) { msg = t; msgTimer = 90; }

function applyTheme() {
  const t = THEMES[save.theme];
  document.body.style.background = t.body;
  canvas.style.borderColor = t.border;
}

function resetPositions() {
  player.x = 200; player.y = H / 2; player.vx = player.vy = 0;
  ai.x = 600;     ai.y = H / 2;     ai.vx = ai.vy = 0;
  ball.x = W / 2; ball.y = H / 2;   ball.vx = ball.vy = 0;
  aiTarget = { x: 600, y: H / 2 };
  aiTimer = 0;
}

function startMatch() {
  score = { you: 0, ai: 0 };
  timeLeft = matchMinutes * 60 * 60;   // minutes -> frames (60 fps)
  const P = PLAYERS[save.selected];
  player.speed = 1.8 + P.speed * 0.2;
  player.power = 5 + P.power * 0.5;
  player.err   = (10 - P.control) * 0.025;
  resetPositions();
  screen = 'play';
  toast('Kick off!');
}

function scoreGoal(who) {
  if (who === 'ai') { score.ai++;  toast('AI SCORES!'); }
  else              { score.you++; toast('GOAL! YOU SCORE!'); }
  resetPositions();
}

function finishMatch() {
  screen = 'over';
  lastResult = score.you > score.ai ? 'win' : score.you < score.ai ? 'lose' : 'draw';
  lastReward = RESULT_REWARD[lastResult] + score.you * GOAL_REWARD;
  save.coins += lastReward;
  saveGame();
}

function ballInfo(p) {
  const dx = ball.x - p.x, dy = ball.y - p.y;
  const d = Math.hypot(dx, dy) || 0.001;
  return { d, nx: dx / d, ny: dy / d, touching: d < p.r + ball.r };
}

function setTheme(key) {
  save.theme = key;
  saveGame();
  applyTheme();
  toast(`${THEMES[key].name} theme!`);
}

function cycleMatchTime() {
  const i = MATCH_OPTIONS.indexOf(matchMinutes);
  matchMinutes = MATCH_OPTIONS[(i + 1) % MATCH_OPTIONS.length];
  toast(`Match: ${matchMinutes} minute`);
}

// ---------- Pack opening ----------
function openPack() {
  if (save.coins < PACK_COST) { toast('Coins kom! Match khele coins jog koro'); return; }
  save.coins -= PACK_COST;

  const roll = Math.random() * 100;
  let acc = 0, picked = 'common';
  for (const k of Object.keys(RARITY)) {
    acc += RARITY[k].weight;
    if (roll < acc) { picked = k; break; }
  }
  const pool = PLAYERS.map((p, i) => i).filter(i => PLAYERS[i].rarity === picked);
  const idx = pool[Math.floor(Math.random() * pool.length)];
  const isNew = !save.owned.includes(idx);

  if (isNew) save.owned.push(idx);
  else save.coins += DUP_REFUND;

  lastPull = { idx, isNew };
  saveGame();
}

// ---------- Update ----------
function update() {
  if (msgTimer > 0) msgTimer--;
  if (screen !== 'play') return;

  timeLeft--;
  if (timeLeft <= 0) { finishMatch(); return; }

  const L = LEVELS[level];

  // --- YOUR movement ---
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.KeyA)  dx -= 1;
  if (keys.ArrowRight || keys.KeyD) dx += 1;
  if (keys.ArrowUp || keys.KeyW)    dy -= 1;
  if (keys.ArrowDown || keys.KeyS)  dy += 1;
  if (touchTarget) {
    const tx = touchTarget.x - player.x, ty = touchTarget.y - player.y;
    const td = Math.hypot(tx, ty);
    if (td > 6) { dx = tx / td; dy = ty / td; } else { dx = 0; dy = 0; }
  }
  const m = Math.hypot(dx, dy);
  if (m > 0) { dx /= m; dy /= m; }
  player.vx = dx * player.speed;
  player.vy = dy * player.speed;
  player.x = clamp(player.x + player.vx, player.r, W - player.r);
  player.y = clamp(player.y + player.vy, player.r, H - player.r);

  // --- AI decision ---
  aiTimer++;
  if (aiTimer >= L.reaction) {
    aiTimer = 0;
    let tx, ty;
    if (ball.x > W * 0.4) {
      tx = ball.x + ball.vx * 6;
      ty = ball.y + ball.vy * 6;
    } else {
      tx = W - 90;
      ty = H / 2 + (ball.y - H / 2) * 0.6;
    }
    if (Math.random() < L.mistake) {
      tx += (Math.random() - 0.5) * 120;
      ty += (Math.random() - 0.5) * 120;
    }
    aiTarget = { x: clamp(tx, ai.r, W - ai.r), y: clamp(ty, ai.r, H - ai.r) };
  }

  // --- AI movement ---
  const ax = aiTarget.x - ai.x, ay = aiTarget.y - ai.y;
  const ad = Math.hypot(ax, ay);
  if (ad > L.aiSpeed) { ai.vx = ax / ad * L.aiSpeed; ai.vy = ay / ad * L.aiSpeed; }
  else { ai.vx = ax; ai.vy = ay; }
  ai.x = clamp(ai.x + ai.vx, ai.r, W - ai.r);
  ai.y = clamp(ai.y + ai.vy, ai.r, H - ai.r);

  // --- Ball physics ---
  ball.x += ball.vx; ball.y += ball.vy;
  ball.vx *= FRICTION; ball.vy *= FRICTION;
  const bs = Math.hypot(ball.vx, ball.vy);
  if (bs > MAX_BALL) { ball.vx *= MAX_BALL / bs; ball.vy *= MAX_BALL / bs; }

  if (ball.y < ball.r)     { ball.y = ball.r;     ball.vy =  Math.abs(ball.vy) * 0.8; }
  if (ball.y > H - ball.r) { ball.y = H - ball.r; ball.vy = -Math.abs(ball.vy) * 0.8; }

  const inMouth = ball.y > GOAL_TOP && ball.y < GOAL_BOTTOM;
  if (inMouth && ball.x < GL)     { scoreGoal('ai'); return; }
  if (inMouth && ball.x > W - GL) { scoreGoal('you'); return; }
  if (!inMouth) {
    if (ball.x < ball.r)     { ball.x = ball.r;     ball.vx =  Math.abs(ball.vx) * 0.8; }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx) * 0.8; }
  }

  // --- YOU touching the ball ---
  const pi = ballInfo(player);
  if (pi.touching) {
    ball.x = player.x + pi.nx * (player.r + ball.r);
    ball.y = player.y + pi.ny * (player.r + ball.r);
    ball.vx += player.vx * 0.6 + pi.nx * 0.15;
    ball.vy += player.vy * 0.6 + pi.ny * 0.15;
  }
  if (shotQueued && pi.d < player.r + ball.r + 10) {
    const a = Math.atan2(pi.ny, pi.nx) + (Math.random() * 2 - 1) * player.err;
    ball.vx = Math.cos(a) * player.power + player.vx * 0.5;
    ball.vy = Math.sin(a) * player.power + player.vy * 0.5;
  }
  shotQueued = false;

  // --- AI touching the ball ---
  aiKickCooldown--;
  const ai_ = ballInfo(ai);
  if (ai_.touching) {
    ball.x = ai.x + ai_.nx * (ai.r + ball.r);
    ball.y = ai.y + ai_.ny * (ai.r + ball.r);
    if (aiKickCooldown <= 0) {
      const angle = Math.atan2(H / 2 - ball.y, 0 - ball.x)
                    + (Math.random() * 2 - 1) * L.aimError;
      ball.vx = Math.cos(angle) * L.kickPower;
      ball.vy = Math.sin(angle) * L.kickPower;
      aiKickCooldown = 30;
    }
  }
}

// ---------- Drawing helpers ----------
function text(t, x, y, size = 18, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px Arial`; ctx.fillStyle = color; ctx.textAlign = align;
  ctx.fillText(t, x, y);
}

function drawCenterText(t, y, size = 36) {
  ctx.font = `bold ${size}px Arial`; ctx.textAlign = 'center';
  ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.strokeText(t, W / 2, y);
  ctx.fillStyle = '#ffd400'; ctx.fillText(t, W / 2, y);
}

function button(x, y, w, h, label, onClick, color = '#ffd400', textColor = '#111') {
  buttons.push({ x, y, w, h, onClick });
  ctx.fillStyle = color; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = textColor; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2);
  ctx.textBaseline = 'alphabetic';
}

function drawCard(idx, x, y, w, h, locked = false) {
  const p = PLAYERS[idx], r = RARITY[p.rarity];
  ctx.fillStyle = locked ? '#374151' : '#111827';
  ctx.fillRect(x, y, w, h);
  ctx.lineWidth = 3; ctx.strokeStyle = locked ? '#4b5563' : r.color;
  ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);

  if (locked) { text('???', x + w / 2, y + h / 2 + 8, 26, '#9ca3af'); return; }

  text(r.name.toUpperCase(), x + w / 2, y + 18, 12, r.color);
  ctx.beginPath();
  ctx.arc(x + w / 2, y + h / 2 - 4, Math.min(w, h) * 0.22, 0, Math.PI * 2);
  ctx.fillStyle = p.color; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  text(p.name, x + w / 2, y + h - 24, Math.round(w * 0.09), '#fff');
  text(`SPD ${p.speed}  PWR ${p.power}  CTL ${p.control}`, x + w / 2, y + h - 8, 11, '#d1d5db');
}

function drawPitch() {
  const t = THEMES[save.theme];
  ctx.fillStyle = t.grass;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = t.stripe;
  for (let i = 0; i < 8; i += 2) ctx.fillRect(i * W / 8, 0, W / 8, H);

  ctx.strokeStyle = t.line; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 60, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeRect(GL, GOAL_TOP - 60, 110, 280);
  ctx.strokeRect(W - GL - 110, GOAL_TOP - 60, 110, 280);

  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fillRect(0, GOAL_TOP, GL, GOAL_BOTTOM - GOAL_TOP);
  ctx.fillRect(W - GL, GOAL_TOP, GL, GOAL_BOTTOM - GOAL_TOP);
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(GL, GOAL_TOP); ctx.lineTo(GL, GOAL_BOTTOM); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W - GL, GOAL_TOP); ctx.lineTo(W - GL, GOAL_BOTTOM); ctx.stroke();
}

function drawPlayer(p, color, label) {
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
  text(label, p.x, p.y - p.r - 6, 12);
}

function drawBall() {
  const t = THEMES[save.theme];
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = t.ballFill; ctx.fill();
  ctx.strokeStyle = t.ballLine; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(ball.x, ball.y, 3.5, 0, Math.PI * 2);
  ctx.fillStyle = t.ballLine; ctx.fill();
}

function drawHUD() {
  const secs = Math.max(0, Math.ceil(timeLeft / 60));
  const mm = Math.floor(secs / 60), ss = String(secs % 60).padStart(2, '0');
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(W / 2 - 140, 8, 280, 36);
  text(`YOU ${score.you}  -  ${score.ai} AI   |   ${mm}:${ss}`, W / 2, 33, 20);
}

// ---------- Screens ----------
function drawMenu() {
  drawCenterText(GAME_NAME, 58, 42);
  text(`Coins: ${save.coins}`, W / 2, 98, 20, '#ffd400');
  text('Selected Player', 180, 112, 14, '#d1d5db');
  drawCard(save.selected, 80, 120, 200, 150);

  // Level choice (middle column)
  text('LEVEL', 440, 140, 16, '#d1d5db');
  [1, 2, 3].forEach((n, i) => {
    button(340, 150 + i * 52, 200, 42, LEVELS[n].name,
      () => { level = n; }, level === n ? '#ffd400' : '#e5e7eb');
  });

  // Match time choice (right column)
  text('MATCH TIME', 680, 140, 16, '#d1d5db');
  MATCH_OPTIONS.forEach((mins, i) => {
    button(590, 150 + i * 52, 180, 42, `${mins} minute`,
      () => { matchMinutes = mins; }, matchMinutes === mins ? '#ffd400' : '#e5e7eb');
  });

  button(60, 320, 200, 50, 'COLLECTION', () => { screen = 'collection'; }, '#60a5fa');
  button(300, 320, 200, 50, 'THEME', () => { screen = 'theme'; }, '#c084fc');
  button(540, 320, 200, 50, 'PACK SHOP', () => { screen = 'shop'; }, '#34d399');
  button(300, 395, 200, 60, 'PLAY', startMatch, '#f97316', '#fff');
  text('Keys: 1/2/3 level • M match time • ENTER play • C collection • T theme • P shop', W / 2, 472, 13, '#d1d5db');
}

function drawCollection() {
  drawCenterText('MY PLAYERS', 50, 40);
  text(`Owned ${save.owned.length} / ${PLAYERS.length}  (tap a player to select)`, W / 2, 78, 14, '#d1d5db');

  PLAYERS.forEach((p, i) => {
    const col = i % 4, row = Math.floor(i / 4);
    const x = 38 + col * 185, y = 85 + row * 110;
    const owned = save.owned.includes(i);
    drawCard(i, x, y, 170, 100, !owned);
    if (i === save.selected) {
      ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 4;
      ctx.strokeRect(x - 3, y - 3, 176, 106);
    }
    if (owned) {
      buttons.push({ x, y, w: 170, h: 100, onClick: () => {
        save.selected = i; saveGame(); toast(`${p.name} selected!`);
      }});
    }
  });

  button(290, 425, 220, 44, 'BACK', () => { screen = 'menu'; }, '#e5e7eb');
}

function drawThemes() {
  drawCenterText('CHOOSE THEME', 60, 44);
  text('Theme sudhu rong change kore. Coins ar players thik thake.', W / 2, 92, 14, '#d1d5db');

  Object.keys(THEMES).forEach((key, i) => {
    const t = THEMES[key];
    const col = i % 3, row = Math.floor(i / 3);
    const x = 70 + col * 240, y = 115 + row * 150, w = 200, h = 120;

    // mini pitch preview
    ctx.fillStyle = t.grass; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = t.line; ctx.lineWidth = 2;
    ctx.strokeRect(x + 8, y + 8, w - 16, h - 16);
    ctx.beginPath(); ctx.moveTo(x + w / 2, y + 8); ctx.lineTo(x + w / 2, y + h - 8); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, 22, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 45, y + h / 2 + 10, 9, 0, Math.PI * 2);
    ctx.fillStyle = t.ai; ctx.fill();
    ctx.beginPath(); ctx.arc(x + w - 45, y + h / 2 - 10, 9, 0, Math.PI * 2);
    ctx.fillStyle = t.ballFill; ctx.fill();

    // selected = gold border
    ctx.lineWidth = 4;
    ctx.strokeStyle = save.theme === key ? '#ffd400' : '#000';
    ctx.strokeRect(x - 2, y - 2, w + 4, h + 4);

    text(t.name + (save.theme === key ? '  ✔' : ''), x + w / 2, y + h + 22, 16, '#fff');

    buttons.push({ x, y, w, h, onClick: () => setTheme(key) });
  });

  button(290, 430, 220, 44, 'BACK', () => { screen = 'menu'; }, '#e5e7eb');
}

function drawShop() {
  drawCenterText('PACK SHOP', 60, 44);
  text(`Coins: ${save.coins}`, W / 2, 98, 20, '#ffd400');
  text('Chance: Common 57% • Rare 28% • Epic 10% • Legend 5%', W / 2, 128, 14, '#d1d5db');

  const canBuy = save.coins >= PACK_COST;
  button(300, 150, 200, 56, `OPEN PACK (${PACK_COST})`, openPack,
    canBuy ? '#f97316' : '#6b7280', canBuy ? '#111' : '#fff');

  if (lastPull) {
    drawCard(lastPull.idx, 300, 225, 200, 130);
    if (lastPull.isNew) text('NEW PLAYER!', W / 2, 382, 22, '#22c55e');
    else text(`Duplicate! +${DUP_REFUND} coins back`, W / 2, 382, 16, '#d1d5db');
  }

  button(290, 430, 220, 44, 'BACK', () => { screen = 'menu'; }, '#e5e7eb');
}

function drawOver() {
  drawCenterText('FULL TIME!', 110, 48);
  const t = lastResult === 'win' ? 'YOU WIN!' : lastResult === 'lose' ? 'AI WINS! Try again' : 'DRAW!';
  drawCenterText(t, 180, 40);
  text(`Final: YOU ${score.you} - ${score.ai} AI`, W / 2, 232, 22);
  text(`Match: ${matchMinutes} minute`, W / 2, 262, 16, '#d1d5db');
  text(`+${lastReward} coins earned`, W / 2, 294, 22, '#ffd400');
  button(170, 320, 200, 56, 'PLAY AGAIN', startMatch, '#f97316', '#fff');
  button(430, 320, 200, 56, 'MENU', () => { screen = 'menu'; }, '#e5e7eb');
}

function draw() {
  buttons = [];
  if (screen === 'play') {
    drawPitch();
    drawPlayer(ai, THEMES[save.theme].ai, 'AI');
    const P = PLAYERS[save.selected];
    drawPlayer(player, P.color, P.name);
    drawBall();
    drawHUD();
    if (msgTimer > 0) drawCenterText(msg, H / 2 - 60, 40);
    return;
  }

  drawPitch();
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);

  if (screen === 'menu') drawMenu();
  else if (screen === 'collection') drawCollection();
  else if (screen === 'theme') drawThemes();
  else if (screen === 'shop') drawShop();
  else if (screen === 'over') drawOver();

  if (msgTimer > 0) text(msg, W / 2, 490, 16, '#ffd400');
}

// ---------- Controls ----------
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' && !e.repeat && screen === 'play') shotQueued = true;

  if (screen === 'menu') {
    if (e.key === '1' || e.key === '2' || e.key === '3') level = Number(e.key);
    if (e.code === 'KeyM') cycleMatchTime();
    if (e.code === 'Enter') startMatch();
    if (e.code === 'KeyC') screen = 'collection';
    if (e.code === 'KeyT') screen = 'theme';
    if (e.code === 'KeyP') screen = 'shop';
  } else if (screen === 'over' && e.code === 'Enter') {
    startMatch();
  }
  if ((screen === 'play' || screen === 'over') && e.code === 'KeyR') startMatch();
  if (e.code === 'Escape') screen = 'menu';
});
addEventListener('keyup', e => { keys[e.code] = false; });

function toField(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}

canvas.addEventListener('pointerdown', e => {
  const p = toField(e);
  if (screen === 'play') {
    touchTarget = p;
    shotQueued = true;
    canvas.setPointerCapture(e.pointerId);
    return;
  }
  for (const b of buttons) {
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      b.onClick();
      return;
    }
  }
});
canvas.addEventListener('pointermove', e => { if (touchTarget) touchTarget = toField(e); });
canvas.addEventListener('pointerup', () => { touchTarget = null; });
canvas.addEventListener('pointercancel', () => { touchTarget = null; });

// ---------- Main loop ----------
applyTheme();
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
